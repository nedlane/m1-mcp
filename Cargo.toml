[package]
name = "m1-mcp"
version = "0.7.3"
edition = "2024"
description = "Model Context Protocol server exposing the MoTeC M1 toolchain to AI agents"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Official Rust MCP SDK. Server + stdio transport + JSON-Schema tool params.
rmcp = { version = "3.0", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# M1 toolchain library crates, pinned to released git tags (same as the rest of
# the stack — never path deps). These are called in-process; there is no PATH
# dependency on installed CLIs.
m1-core = { git = "https://github.com/C-Nucifora/m1-core.git", tag = "v0.15.0" }
m1-typecheck = { git = "https://github.com/C-Nucifora/m1-typecheck.git", tag = "v0.50.0" }
m1-lint = { git = "https://github.com/C-Nucifora/m1-lint.git", tag = "v0.24.1" }
m1-fmt = { git = "https://github.com/C-Nucifora/m1-fmt.git", tag = "v0.17.1" }
m1-workspace = { git = "https://github.com/nedlane/m1-workspace.git", tag = "v0.13.0" }
m1-can = { git = "https://github.com/nedlane/m1-can.git", tag = "v0.2.2" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
